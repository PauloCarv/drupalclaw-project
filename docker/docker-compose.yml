services:
  drupalclaw:
    image: ghcr.io/paulocarv/drupalclaw-project:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8090:8080"
    volumes:
      - ../config:/config
      - drupalclaw_agent:/config/.pi/agent
      - ../config/.pi/agent:/legacy-agent:ro
      - ../workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PICLAW_DOCKER_ENABLED=1
      - PICLAW_ASSISTANT_NAME=DrupalClaw
      - TZ=Europe/Lisbon
    group_add:
      - "0"
    restart: unless-stopped

volumes:
  drupalclaw_agent:
